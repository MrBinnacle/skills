# Vale configuration for the collection.
#
# TWO STYLES, TWO SCOPES, AND THE SCOPE DIFFERENCE IS THE POINT.
#
# Taste  - six rules vendored byte-equal from MrBinnacle/skill-harness, which owns
#          them. They govern PROSE (vagueness, hedging, dressing, evidence, voice,
#          brevity) and apply to markdown across the tree.
#
# Local  - one rule generated from assets/tokens.json > copy.words_to_avoid. It bans
#          MARKETING copy. The token file declares four surfaces for that list, and this
#          file binds the rule to exactly one of them, README.md, under that surface's
#          own terms:
#
#              "README headers only. The front page's headings are the copy a stranger
#               skims."
#
#          Binding it anywhere else is a decision, not a maintenance task.
#          scripts/validate_vale_style.py fails the build if any section outside the
#          declared surface globs enables Local.
#
# COVERAGE THIS FILE CANNOT PROVIDE, AND IT IS NOW MOST OF THE SCOPE. The operator ruled
# on 2026-09-06 that one word list binds every line of prose in every repository (#261),
# and the token file carries that as a markdown_prose surface over every tracked .md
# except `_quarantine/**` and CHANGELOG.md. Vale reaches none of it, nor the SVG
# attributes, nor the package description: it is bound here to README headings alone.
# scripts/validate_brand_kit.py is the gate for all four surfaces. Vale is the fast
# feedback on one of them, not the guarantee.
#
# Promoted by ticket #108: five of the six Taste rows are now ERROR (see the
# per-row overrides below). .github/workflows/vale.yml runs a second, ungated pass at
# --minAlertLevel=error that fails the job on any of these five rows; the existing
# full-report pass keeps continue-on-error. Generic-ness STAYS warning: one hit remains in
# docs/adr/0001-occasions-are-not-dispatches.md, and this session's canonical-document
# guard (CLAUDE.md section 5 plan gate) refuses an edit to docs/adr/** without a
# human-approved plan naming the file. Promoting Generic-ness here would redden CI on
# a file this pass cannot touch, so the row holds at warning until that ADR is fixed
# under its own plan. Local (the marketing-word rule) is untouched by this ticket.

StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Taste
Taste.Brevity-and-order = error
Taste.Dressing = error
Taste.Evidence = error
Taste.Register = error
Taste.Voice = error

[README.md]
BasedOnStyles = Taste, Local, Claims

# Claims - one rule, owned here, banning a card-set number in prose. Bound to the
# reader-facing surfaces a stranger lands on, and only where Vale is ACTUALLY RUN.
# `_quarantine/` is deliberately outside both run sites (see vale.yml and the
# vale-prose hook), so binding a rule to it would declare an assurance that never
# executes - which is the shape of defect this rule exists to catch. Quarantine
# prose is covered by scripts/check_prose_claims.py instead.
#
# It bans the EXPLICIT form, "N cards" and "N candidates". It cannot see
# "publishes 14 of them", where the number is adjacent to no noun the rule can
# anchor on; nothing lexical can. That form is covered by there being exactly one
# surface where a number is derived on read - the card-evidence table CI rebuilds -
# and by scripts/check_prose_claims.py, which checks the claims that ARE structural.
[skills/*/README.md]
BasedOnStyles = Taste, Claims
