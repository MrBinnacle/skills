# Vale configuration for the collection.
#
# TWO STYLES, TWO SCOPES, AND THE SCOPE DIFFERENCE IS THE POINT.
#
# Taste  - six rules vendored byte-equal from MrBinnacle/skill-harness, which owns
#          them. They govern PROSE (vagueness, hedging, dressing, evidence, voice,
#          brevity) and apply to markdown across the tree.
#
# Local  - one rule generated from assets/tokens.json > copy.words_to_avoid. It bans
#          MARKETING copy, and that token file binds it to named public surfaces only:
#
#              "README headers only. The front page's headings are the copy a stranger
#               skims; its body prose is working documentation and out of scope."
#
#          Widening it is a decision, not a maintenance task. scripts/validate_vale_style.py
#          fails the build if any section outside the declared surfaces enables Local.
#
# COVERAGE THIS FILE CANNOT PROVIDE. Of the three surfaces the token file declares,
# Vale reaches only README.md - it lints markdown, not SVG attributes or a JSON field.
# assets/*.svg and package.json > description are enforced by scripts/validate_brand_kit.py,
# which remains the gate for all three. Vale is the fast feedback, not the guarantee.
#
# Warning level by ticket #194: findings report, they do not block a merge.

StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Taste

[README.md]
BasedOnStyles = Taste, Local
