# De-personalization gate — fail-closed pre-push residue check.
#
# WHY THIS EXISTS
#   Skills are extracted from a private source tree (~/.claude/skills) that legitimately
#   carries private-project provenance (codenames, ticket IDs, a private repo link).
#   That provenance must NOT reach this public collection. Historically it was scrubbed
#   by hand at publish time and leaked three times because the check lived nowhere.
#
# WHAT IT DOES  (and deliberately does NOT do)
#   It REFUSES the commit/push and reports the file, line, and suggested replacement.
#   It does NOT auto-rewrite. A silent rewrite would hide the source<->publish divergence
#   permanently — papering over the root cause. The block forces a conscious edit, so the
#   de-personalization decision stays audited. The hook NAME carries the suggested fix.
#
# SCOPE
#   Every hook below reads EVERY tracked text file (`types: [text]`), not Markdown
#   alone (#539): traces, transcripts, scripts and JSON fixtures reached a public
#   repo unread while the gate passed. Never narrow a hook back to an extension.
#   The only escape is a path in `exclude`, one file at a time, with its reason
#   beside it. Two anchors hold the lists: `scan_exempt` for the codename hooks and
#   `fields_exempt` for the account-data hooks.
#   The maintainer's name/email are intentionally NOT listed here — putting them in a
#   public block-list would itself de-anonymize. Keep those in a git-ignored local
#   overlay if wanted (see AGENTS.md "De-personalization gate").
#
# ACTIVATE (once per clone):
#   pre-commit install --hook-type pre-commit --hook-type pre-push
# FULL-TREE SWEEP on demand:
#   pre-commit run --all-files

minimum_pre_commit_version: "3.2.0"
default_stages: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: residue-writ
        name: "residue 'Writ' (private project codename) -> 'a personal production project'"
        language: pygrep
        entry: '\bWrit\b'
        types: [text]
        # Path exemptions, each with its reason (#539). Add a file here only when it
        # must carry a term to do its job; never an extension or a directory.
        #   .pre-commit-config.yaml            defines these patterns
        #   scripts/validate_path_residue.py   the path-term list that mirrors them
        #   scripts/test_validate_path_residue.py  poison samples, one per term
        #   scripts/test_depersonalization_scope.py  poison fixtures for this gate
        exclude: &scan_exempt '^(\.pre-commit-config\.yaml|scripts/(validate_path_residue|test_validate_path_residue|test_depersonalization_scope)\.py)$'
      - id: residue-sec-id
        name: "residue 'SEC-<n>' (private security ticket id) -> drop, or 'a security-audit item'"
        language: pygrep
        entry: '\bSEC-[0-9]+'
        types: [text]
        exclude: *scan_exempt
      - id: residue-wi-id
        name: "residue 'WI-<n>' (private work-item id) -> drop, or 'a work item'"
        language: pygrep
        entry: '\bWI-[0-9]+'
        types: [text]
        exclude: *scan_exempt
      - id: residue-research-dir
        name: "residue 'skills_research' (private research dir) -> a generic descriptor"
        language: pygrep
        entry: 'skills[_.-]research'
        types: [text]
        exclude: *scan_exempt
      - id: residue-private-repo-dir
        name: "residue 'youwontdoit' (private repo dir) -> a generic descriptor"
        language: pygrep
        entry: 'youwontdoit'
        types: [text]
        exclude: *scan_exempt
      - id: residue-private-repo-link
        name: "residue 'MrBinnacle/writ' (PRIVATE repo, 404s for readers) -> drop the link"
        language: pygrep
        entry: 'MrBinnacle/writ'
        types: [text]
        exclude: *scan_exempt
      - id: residue-private-linter-repo
        name: "residue 'workspace_lint' (PRIVATE repo name) -> a generic descriptor"
        language: pygrep
        entry: 'workspace[_.-]lint'
        types: [text]
        exclude: *scan_exempt

      # -- Account data in evidence files (#539) -----------------------------
      #
      # A replay trace committed under _quarantine/ carried the replaying
      # account's quota state and per-session identifiers, and the gate read only
      # Markdown. These four hooks name the classes that incident showed. Hook ids
      # do not start with `residue-`: that prefix is the codename list, mirrored in
      # validate_path_residue.py, and these terms never appear in a path.
      #
      # A value of REDACTED, <redacted> or any non-UUID placeholder passes: the
      # identifier patterns fire only on a real UUID-shaped value.
      - id: leak-rate-limit-event
        name: "account billing event 'rate_limit_event' (the replaying account's quota state) -> drop the event line from the trace"
        language: pygrep
        entry: 'rate_limit_event'
        types: [text]
        # strip_system.py is the scrubber; it names the fields it drops.
        exclude: &fields_exempt '^(\.pre-commit-config\.yaml|scripts/test_depersonalization_scope\.py|_quarantine/walk-the-recipe/replay/strip_system\.py)$'
      - id: leak-overage-status
        name: "account billing field 'overageStatus' -> drop the field, or replace with 'REDACTED'"
        language: pygrep
        entry: 'overageStatus'
        types: [text]
        exclude: *fields_exempt
      - id: leak-utilization
        name: "account quota field 'utilization' in a rate-limit context -> drop the field, or replace with 'REDACTED'"
        language: pygrep
        entry: '(?i)((rate[_ -]?limit|seven_day|five_hour|overage)\W.*\butilization\b|\butilization\b.*(rate[_ -]?limit|seven_day|five_hour|overage)|"utilization"\s*:\s*[0-9])'
        types: [text]
        exclude: *fields_exempt
      - id: leak-session-id
        name: "unredacted session_id/request_id (UUID value) -> replace the value with 'REDACTED'"
        language: pygrep
        entry: '(?i)(session|request)[_-]?id["'']?\s*[:=]\s*["'']?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
        types: [text]
        exclude: *fields_exempt

      # -- Residue in PATHS (#243) -------------------------------------------
      #
      # The seven hooks above read CONTENTS and never see a filename, so a
      # private name in a path passed them and reached main. This hook reads
      # `git ls-files` - every tracked and staged PATH - against the same seven
      # terms, with `_`, `-` and `.` treated as one separator. The term list is
      # duplicated in the script on purpose; its suite fails when the two drift.
      - id: residue-in-paths
        name: "residue term in a tracked file or directory NAME"
        language: system
        entry: python scripts/validate_path_residue.py
        pass_filenames: false
        always_run: true

      # -- Residue in COMMIT MESSAGES ------------------------------------------
      #
      # The hooks above read tracked files, and a commit message is not one, so
      # a codename in a message reached main 14 times (122464d, 5f68de4, ...).
      # This hook applies the `residue-` entries above to the message; it copies
      # no term. CI applies the same script to every commit, the title and the
      # body of a pull request (depersonalization-gate.yml).
      - id: residue-commit-msg
        name: "residue term in the commit message"
        language: system
        entry: python scripts/check_message_residue.py --commit-msg
        stages: [commit-msg]

      # -- Quarantine landing (#249) -----------------------------------------
      #
      # `_quarantine/` is tracked, so `git add -A` sweeps an unfinished
      # candidate into a public commit. This hook refuses a commit that stages a
      # NEW `_quarantine/<skill>/` directory - one with no tracked file at HEAD -
      # unless the same commit stages `LANDING.md` in that directory with
      # `intentional-landing: true` on its first line. The marker is authored
      # with the candidate, not typed at the keyboard.
      #
      # It reads the STAGED index, so `pre-commit run --all-files` in CI - where
      # nothing is staged relative to HEAD - passes with a note. That is by
      # design: #249 measured the hazard as a main-tree one.
      - id: quarantine-landing
        name: "a new _quarantine/<skill>/ needs LANDING.md to declare the landing"
        language: system
        entry: python scripts/validate_quarantine_landing.py
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # -- Taste prose style (#194) ------------------------------------------
      #
      # THREE HOOKS, TWO JOBS. The first guards the CONFIGURATION and always runs:
      # a vendored rule edited locally, a generated rule out of step with
      # assets/tokens.json, or a widened marketing scope all fail here. It needs no
      # Vale binary, so it works on every clone.
      #
      # The second and third run VALE ITSELF at error level. Every row currently
      # ships at warning, so they are a deliberate no-op until the rows are
      # promoted - the carrier is installed now so that promotion is a level change
      # and not a new integration. They skip cleanly when Vale is absent.
      - id: vale-style-config
        name: "Taste style config: vendored digests, generated rule, scope binding"
        language: system
        entry: python scripts/validate_vale_style.py
        pass_filenames: false
        always_run: true

      # SCOPE (#244): README.md, CATALOG.md, skills/ and docs/ - the same paths CI
      # lints in .github/workflows/vale.yml. `_quarantine/` is NOT linted at
      # either site: it holds frozen documents that must not be rewritten, and a
      # hook that refused what CI accepts was being skipped as routine. Change
      # this regex and the workflow's path list together;
      # scripts/test_vale_scope.py fails when the two sets differ.
      - id: vale-prose
        name: "Taste prose (error level) on staged markdown under README.md, CATALOG.md, skills/, docs/"
        language: system
        entry: python scripts/vale_hook.py
        files: '^(README\.md|CATALOG\.md|skills/.*\.md|docs/.*\.md)$'

      - id: vale-commit-msg
        name: "Taste prose (error level) on the commit message"
        language: system
        entry: python scripts/vale_hook.py --commit-msg
        stages: [commit-msg]
        always_run: true
