name: links

# Every skill here is about not trusting a green light you didn't earn.
# This checks that the links in our own docs actually resolve — on every PR,
# and weekly, to catch link rot before a reader does.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Card-file conformance suite
        run: |
          set -euo pipefail
          out="$(python scripts/test_validate_card_files.py)"
          echo "$out"
          echo "$out" | grep -q '^PASS:' \
            || { echo "::error::card-file suite emitted no PASS line - it did not run"; exit 1; }
      - name: Card-file conformance check
        run: |
          set -euo pipefail
          out="$(python scripts/validate_card_files.py)"
          echo "$out"
          echo "$out" | grep -q '^PASS:' \
            || { echo "::error::card-file checker emitted no PASS line - it did not run"; exit 1; }
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
