name: links

# Every skill here is about not trusting a green light you did not verify.
# This checks that the links in our own docs actually resolve — on every PR,
# and weekly, to catch link rot before a reader does.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Card-file conformance suite
        run: |
          set -euo pipefail
          out="$(python scripts/test_validate_card_files.py)"
          echo "$out"
          echo "$out" | grep -q '^PASS:' \
            || { echo "::error::card-file suite emitted no PASS line - it did not run"; exit 1; }
      - name: Card-file conformance check
        run: |
          set -euo pipefail
          out="$(python scripts/validate_card_files.py)"
          echo "$out"
          echo "$out" | grep -q '^PASS:' \
            || { echo "::error::card-file checker emitted no PASS line - it did not run"; exit 1; }
      # docs/design/variants/ is excluded, and the reason is that its links are
      # correct rather than broken. The files there are archived drafts of the
      # root README.md, preserved unselected at skills#201. Their relative links
      # (ADMISSION.md, skills/*/EVIDENCE.md, .claude-plugin/marketplace.json)
      # resolve from the repository root, which is where the file they draft
      # lives. Four directories down they resolve to nothing, and lychee reports
      # 42 errors that are all the same fact.
      #
      # Rewriting the links would make the check pass by corrupting the artifact
      # the archive exists to hold: a draft whose paths have been rewritten is no
      # longer the draft that was written. Excluding the directory states what is
      # true - these are not live documentation and their targets belong to a
      # location they no longer sit in.
      # `https://openrouter.ai/api/v1` is excluded for the same reason as the
      # directory above: it is correct, not broken. It appears in
      # _quarantine/anthropic-sdk-via-openrouter/SKILL.md as the value of a
      # `base_url=` argument inside the frontmatter description. It is an API
      # base path that client code concatenates a route onto, not a page a
      # reader is meant to open, and a bare GET against it returns 404 by
      # design. Measured 2026-09-06: `curl -o /dev/null -w '%{http_code}'`
      # returns 404 deterministically, and lychee reported it on skills#239, a
      # pull request that changed only AGENTS.md.
      #
      # lychee extracts the URL from inside the quoted argument and cannot tell
      # an API base from a dead page. Rewriting the card to satisfy the checker
      # would change a documented constructor argument into something a reader
      # cannot copy, which trades a working example for a green light.
      #
      # The exclusion is anchored to the exact base path. A 404 anywhere else on
      # openrouter.ai still fails this job. Recorded as skills#240.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --exclude-path docs/design/variants
            --exclude '^https://openrouter\.ai/api/v1$'
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
