name: tests

# Two skills in this collection ship executable code: the session-boundary pair
# validates the packet that carries one session's state into the next. That
# validator had a passing test suite and no job that ran it. The same job also
# runs the repo-level scoreboard validator (the front-page admitted / measured /
# retired / solutions-looking-for-a-problem counts, plus the admission-policy
# version pin on the gate card).
#
# Validators are invoked directly, not through pytest, and that is deliberate.
# The skill suites drive their cases from `if __name__ == "__main__"` and their
# functions are not `test_`-prefixed, so `pytest` collects nothing from them and
# reports "no tests ran" — a green line that means the opposite of what it looks
# like. Running the real entrypoint and asserting the PASS line is what makes
# this job honest about whether anything executed.
#
# Windows is in the matrix because that is where these skills are actually used.
# Scoreboard validator output is ASCII-only so a cp1252 console cannot kill the
# Windows cell on a status line.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Producer validator suite
        run: |
          set -euo pipefail
          cd skills/engineering/im-down
          out="$(python test_validate_packet.py)"
          echo "$out"
          echo "$out" | grep -q '^PASS:' \
            || { echo "::error::producer suite emitted no PASS line — it did not run"; exit 1; }

      - name: Receiver validator suite
        run: |
          set -euo pipefail
          cd skills/engineering/im-up
          out="$(python test_validate_packet.py)"
          echo "$out"
          echo "$out" | grep -q '^PASS:' \
            || { echo "::error::receiver suite emitted no PASS line — it did not run"; exit 1; }

      # A gate that cannot fail guards nothing. A stale packet must be rejected,
      # so this asserts the shipped validator still refuses one.
      #
      # The log goes to RUNNER_TEMP, not to the working directory. This step runs
      # inside a published skill folder, and writing control.log there put a file
      # in that folder which the format gate below correctly refused. Gitignored,
      # so it never shipped -- but a skill folder is not scratch space, and the
      # fix is to stop writing there rather than to widen what the gate allows.
      - name: Poison control — a stale packet must be rejected
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/control-stale.log"
          cd skills/engineering/im-down
          if python validate_packet.py fixture-stale.md \
               --mode produce --repo-root "$GITHUB_WORKSPACE" > "$log" 2>&1; then
            echo "::error::stale fixture was ACCEPTED — the validator no longer rejects a stale packet"
            cat "$log"
            exit 1
          fi
          grep -q 'REJECTED' "$log" \
            || { echo "::error::stale fixture failed for the wrong reason"; cat "$log"; exit 1; }
          echo "control: stale packet rejected as expected"

      - name: Scoreboard validator
        run: |
          set -euo pipefail
          out="$(python scripts/validate_scoreboard.py)"
          echo "$out"
          echo "$out" | grep -q '^PASS:' \
            || { echo "::error::scoreboard validator emitted no PASS line — it did not run"; exit 1; }

      # A gate that cannot fail guards nothing. A scoreboard that disagrees with
      # the derived counts must be rejected, so this asserts the shipped
      # validator still refuses one.
      - name: Poison control — a disagreeing scoreboard must be rejected
        run: |
          set -euo pipefail
          if python scripts/validate_scoreboard.py \
               --root scripts/fixtures/scoreboard-mismatch \
               > control-scoreboard.log 2>&1; then
            echo "::error::mismatch fixture was ACCEPTED — the validator no longer rejects a disagreeing scoreboard"
            cat control-scoreboard.log
            exit 1
          fi
          grep -q 'scoreboard' control-scoreboard.log \
            || { echo "::error::mismatch fixture failed for the wrong reason"; cat control-scoreboard.log; exit 1; }
          echo "control: disagreeing scoreboard rejected as expected"

      # The version half needs its own control. The mismatch fixture above fails
      # on the scoreboard and returns before the version check runs, so it proves
      # nothing about version drift. This fixture has a CORRECT scoreboard and a
      # gate card pinned to a different edition than ADMISSION.md declares, so the
      # only thing it can fail on is the assertion under test.
      - name: Poison control - a drifted policy version must be rejected
        run: |
          set -euo pipefail
          if python scripts/validate_scoreboard.py \
               --root scripts/fixtures/admission-version-drift \
               > control-version.log 2>&1; then
            echo "::error::version-drift fixture was ACCEPTED - the validator no longer refuses policy version drift"
            cat control-version.log
            exit 1
          fi
          grep -q 'admission policy version drift' control-version.log \
            || { echo "::error::version-drift fixture failed for the wrong reason"; cat control-version.log; exit 1; }
          echo "control: drifted policy version rejected as expected"

      # `0 measured` is the one scoreboard field that is currently zero, and a
      # zero is exactly the value a broken derivation returns by accident. This
      # fixture carries a card whose Screen result states a controlled outcome
      # while every site still says `0 measured`; the other three numbers agree
      # and the policy version matches, so the only thing it can fail on is the
      # assertion under test. It is the day-the-first-card-is-screened rehearsal.
      - name: Poison control - a stale measured count must be rejected
        run: |
          set -euo pipefail
          if python scripts/validate_scoreboard.py \
               --root scripts/fixtures/measured-drift \
               > control-measured.log 2>&1; then
            echo "::error::measured-drift fixture was ACCEPTED - the measured count is not derived from the cards"
            cat control-measured.log
            exit 1
          fi
          grep -q "measured 0 != 1 derived from the cards' controlled fields" control-measured.log \
            || { echo "::error::measured-drift fixture failed for the wrong reason"; cat control-measured.log; exit 1; }
          echo "control: stale measured count rejected as expected"

      # The origin-tier half needs its own control. The front page states how many
      # cards trace to a real incident, and it stated seven when the records read
      # six -- inside the sentence explaining why the tiers are kept distinct. This
      # fixture's four scoreboard numbers agree and its policy version matches, so
      # the only thing it can fail on is the tiering assertion under test.
      - name: Poison control - a drifted origin tiering must be rejected
        run: |
          set -euo pipefail
          if python scripts/validate_scoreboard.py \
               --root scripts/fixtures/origin-tier-drift \
               > control-origin.log 2>&1; then
            echo "::error::origin-tier-drift fixture was ACCEPTED - the origin tiering is not derived from the cards"
            cat control-origin.log
            exit 1
          fi
          grep -q "origin-tier statement" control-origin.log \
            || { echo "::error::origin-tier-drift fixture failed for the wrong reason"; cat control-origin.log; exit 1; }
          echo "control: drifted origin tiering rejected as expected"

      # SECURITY.md commits to a closed format vocabulary inside skill folders.
      # These steps are the check behind that sentence. They run AFTER the
      # validator suites above on purpose: those suites import the shipped
      # modules, so __pycache__ exists by now and the gate's bytecode rule is
      # exercised against real compiled files rather than only against fixtures.
      #
      # This DETECTS violations. It does not prevent them: `main` has no branch
      # protection and no required checks, so a direct push lands regardless.
      - name: Skill-format gate suite
        run: |
          set -euo pipefail
          out="$(python scripts/test_validate_skill_formats.py)"
          echo "$out"
          echo "$out" | grep -q '^PASS:' \
            || { echo "::error::skill-format gate suite emitted no PASS line — it did not run"; exit 1; }

      - name: Skill-format gate
        run: |
          set -euo pipefail
          out="$(python scripts/validate_skill_formats.py)"
          echo "$out"
          echo "$out" | grep -q '^PASS:' \
            || { echo "::error::skill-format gate emitted no PASS line — it did not run"; exit 1; }

      # A gate that cannot fail guards nothing. Built here rather than checked in:
      # the walker discovers skill folders by SKILL.md marker repo-wide, so a
      # committed violating fixture would turn the real run permanently red and
      # have to be bought back with an exclusion list — a hole in the one check
      # that exists to have none.
      - name: Poison control — a non-declared format in a skill folder must be rejected
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/control-format/skills/engineering/planted"
          mkdir -p "$tree"
          printf '# a skill\n' > "$tree/SKILL.md"
          printf '#!/bin/sh\necho hi\n' > "$tree/install.sh"
          if python scripts/validate_skill_formats.py \
               --root "$RUNNER_TEMP/control-format" > control-format.log 2>&1; then
            echo "::error::planted install.sh was ACCEPTED — the gate no longer rejects a non-declared format"
            cat control-format.log
            exit 1
          fi
          grep -q 'install.sh' control-format.log \
            || { echo "::error::planted fixture failed for the wrong reason"; cat control-format.log; exit 1; }
          echo "control: non-declared format rejected as expected"

      # The second half of the format rule needs its own control. The step above
      # fails on a suffix and proves nothing about compiled Python, which is
      # admitted only when the source it derives from sits beside it. Bytecode
      # with no source is the hiding place a blanket __pycache__ exclusion would
      # have opened, so it is the assertion under test here.
      - name: Poison control — bytecode with no readable source must be rejected
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/control-pyc/skills/engineering/planted"
          mkdir -p "$tree/__pycache__"
          printf '# a skill\n' > "$tree/SKILL.md"
          printf 'print("hi")\n' > "$tree/helper.py"
          printf 'compiled\n' > "$tree/__pycache__/helper.cpython-313.pyc"
          printf 'compiled\n' > "$tree/__pycache__/evil.cpython-313.pyc"
          if python scripts/validate_skill_formats.py \
               --root "$RUNNER_TEMP/control-pyc" > control-pyc.log 2>&1; then
            echo "::error::orphan bytecode was ACCEPTED — the gate no longer requires source beside a .pyc"
            cat control-pyc.log
            exit 1
          fi
          grep -q 'evil.cpython-313.pyc' control-pyc.log \
            || { echo "::error::orphan-bytecode fixture failed for the wrong reason"; cat control-pyc.log; exit 1; }
          grep -q 'no readable source' control-pyc.log \
            || { echo "::error::orphan-bytecode fixture failed for the wrong reason"; cat control-pyc.log; exit 1; }
          if grep -q 'helper.cpython-313.pyc' control-pyc.log; then
            echo "::error::bytecode WITH its source beside it was also rejected"
            cat control-pyc.log
            exit 1
          fi
          echo "control: bytecode with no readable source rejected as expected"

      # BRAND.md's Voice section states that a voice specimen is a line the owner
      # wrote or ratified, cited to VERBATIM.md. These steps are the check behind
      # that sentence. The section used to derive voice by reading the shipped
      # front page -- which had itself opened with generated copy in his voice, so
      # the page became its own provenance and an assistant's sentence became the
      # establishing example of how he writes.
      #
      # This DETECTS violations. It does not prevent them: `main` has no branch
      # protection and no required checks, so a direct push lands regardless.
      - name: Voice-provenance suite
        run: |
          set -euo pipefail
          out="$(python scripts/test_validate_voice_provenance.py)"
          echo "$out"
          echo "$out" | grep -q '^PASS:' \
            || { echo "::error::voice-provenance suite emitted no PASS line — it did not run"; exit 1; }

      - name: Voice-provenance check
        run: |
          set -euo pipefail
          out="$(python scripts/validate_voice_provenance.py)"
          echo "$out"
          echo "$out" | grep -q '^PASS:' \
            || { echo "::error::voice-provenance check emitted no PASS line — it did not run"; exit 1; }

      # A gate that cannot fail guards nothing. This is the control the ticket
      # names: a specimen sourced from the shipped front page must be rejected,
      # and for THAT reason rather than incidentally. Fixture and log both live in
      # RUNNER_TEMP -- a poison BRAND.md in the working tree would be picked up by
      # the real check two steps above.
      - name: Poison control — a voice specimen sourced from README.md must be rejected
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/control-voice"
          log="$RUNNER_TEMP/control-voice.log"
          mkdir -p "$tree"
          {
            printf '# The record\n\n## The lines\n\n'
            printf '### On method -- 2026-08-12\n\n'
            printf '> Follow the time stamps.\n'
          } > "$tree/VERBATIM.md"
          {
            printf '# BRAND.md\n\n## Voice\n\n'
            printf '> Follow the time stamps.\n\n'
            printf 'Source: read from [`README.md`](README.md), the shipped front page.\n\n'
            printf '## The name\n'
          } > "$tree/BRAND.md"
          if python scripts/validate_voice_provenance.py --root "$tree" > "$log" 2>&1; then
            echo "::error::a README-sourced voice specimen was ACCEPTED — the check no longer refuses one"
            cat "$log"
            exit 1
          fi
          grep -q 'shipped public surface' "$log" \
            || { echo "::error::README-sourced fixture failed for the wrong reason"; cat "$log"; exit 1; }
          grep -q 'README.md' "$log" \
            || { echo "::error::README-sourced fixture failed for the wrong reason"; cat "$log"; exit 1; }
          echo "control: README-sourced voice specimen rejected as expected"

      # The provenance half needs its own control. The step above fails on the
      # CITATION and proves nothing about whether the quoted text was ever said.
      # This fixture carries a CORRECT citation to the record and a line that is
      # not in it, so the only thing it can fail on is the assertion under test --
      # the one that stops a citation from being an unchecked claim.
      - name: Poison control — a fabricated quote citing the record must be rejected
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/control-voice-fabricated"
          log="$RUNNER_TEMP/control-voice-fabricated.log"
          mkdir -p "$tree"
          {
            printf '# The record\n\n## The lines\n\n'
            printf '### On method -- 2026-08-12\n\n'
            printf '> Follow the time stamps.\n'
          } > "$tree/VERBATIM.md"
          {
            printf '# BRAND.md\n\n## Voice\n\n'
            printf '> A sentence nobody ever said, generated to sound right.\n\n'
            printf 'Source: [`VERBATIM.md`](VERBATIM.md), *On method*, 2026-08-12.\n\n'
            printf '## The name\n'
          } > "$tree/BRAND.md"
          if python scripts/validate_voice_provenance.py --root "$tree" > "$log" 2>&1; then
            echo "::error::a fabricated quote citing the record was ACCEPTED — provenance is unchecked"
            cat "$log"
            exit 1
          fi
          grep -q 'not a recorded line' "$log" \
            || { echo "::error::fabricated-quote fixture failed for the wrong reason"; cat "$log"; exit 1; }
          echo "control: fabricated quote citing the record rejected as expected"

      # The defect in its ORIGINAL shape, and the one a blockquote-only check
      # would have walked straight past. Every specimen this work replaced was
      # written as inline italics with the front page named in the surrounding
      # prose -- so a check that only looks at blockquotes would have passed the
      # very file it exists to have caught. An inline quotation in the Voice
      # section is refused rather than checked, and this proves it.
      - name: Poison control — an inline italic quotation must be rejected
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/control-voice-inline"
          log="$RUNNER_TEMP/control-voice-inline.log"
          mkdir -p "$tree"
          {
            printf '# The record\n\n## The lines\n\n'
            printf '### On method -- 2026-08-12\n\n'
            printf '> Follow the time stamps.\n'
          } > "$tree/VERBATIM.md"
          {
            printf '# BRAND.md\n\n## Voice\n\n'
            printf '> Follow the time stamps.\n\n'
            printf 'Source: [`VERBATIM.md`](VERBATIM.md), *On method*, 2026-08-12.\n\n'
            printf '**First person.** *"I kept adding skills to my assistant."* Read off the page.\n\n'
            printf '## The name\n'
          } > "$tree/BRAND.md"
          if python scripts/validate_voice_provenance.py --root "$tree" > "$log" 2>&1; then
            echo "::error::an inline italic quotation was ACCEPTED — the original defect shape still passes"
            cat "$log"
            exit 1
          fi
          grep -q 'inline quotation' "$log" \
            || { echo "::error::inline-quotation fixture failed for the wrong reason"; cat "$log"; exit 1; }
          echo "control: inline italic quotation rejected as expected"

      # SECURITY.md's "Standing obligations" section (`conformance v1`) states what
      # a card owes for as long as it stays published. These steps are the check
      # behind that section. The weekly conformance-schedule.yml runs the same two
      # commands on a clock; this job runs them at merge time, where they are cheap.
      #
      # Same caveat as every other check here: this DETECTS breaches. `main` has no
      # required checks, so a nonzero exit is a signal, not a gate.
      - name: Conformance suite
        run: |
          set -euo pipefail
          out="$(python scripts/test_validate_conformance.py)"
          echo "$out"
          echo "$out" | grep -q '^PASS:' \
            || { echo "::error::conformance suite emitted no PASS line - it did not run"; exit 1; }

      - name: Standing obligations sweep
        run: |
          set -euo pipefail
          out="$(python scripts/validate_conformance.py)"
          echo "$out"
          echo "$out" | grep -q '^PASS: conformance v1' \
            || { echo "::error::conformance sweep emitted no PASS line - it did not run"; exit 1; }

      # A sweep that cannot fail guards nothing. This is the historical breach
      # shape: a card ships a script its SKILL.md never names. Built in RUNNER_TEMP
      # rather than checked in -- a committed breaching card would sit inside the
      # guarded set and turn the real run permanently red.
      - name: Poison control - an unnamed shipped script must be rejected
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/conformance-poison"
          log="$RUNNER_TEMP/control-conformance.log"
          rm -rf "$tree"
          mkdir -p "$tree/skills/engineering/poison-card" "$tree/scripts"
          cp scripts/validate_skill_formats.py "$tree/scripts/"
          cp SECURITY.md "$tree/SECURITY.md"
          card="$tree/skills/engineering/poison-card"
          printf '# poison-card\n\nInstructions that name no script.\n' > "$card/SKILL.md"
          {
            printf '# EVIDENCE - poison-card\n\n| Field | Value |\n|---|---|\n'
            printf '| **Screen result** | UNMEASURED. |\n'
            printf '| **Paired verdict** | UNMEASURED. |\n'
          } > "$card/EVIDENCE.md"
          printf "print('hi')\n" > "$card/helper.py"
          if python scripts/validate_conformance.py --root "$tree" > "$log" 2>&1; then
            echo "::error::the unnamed-script fixture was ACCEPTED - the sweep no longer rejects the historical breach shape"
            cat "$log"
            exit 1
          fi
          grep -q 'helper.py' "$log" \
            || { echo "::error::unnamed-script fixture failed for the wrong reason"; cat "$log"; exit 1; }
          echo "control: unnamed shipped script rejected as expected"

      # The delegated half. The same planted undeclared format the format gate
      # refuses must also turn the conformance sweep red, through O1 -- otherwise
      # the delegation is decorative.
      - name: Poison control - a planted undeclared format must fail the sweep too
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/conformance-format-poison"
          log="$RUNNER_TEMP/control-conformance-format.log"
          rm -rf "$tree"
          mkdir -p "$tree/skills/engineering/poison-card" "$tree/scripts"
          cp scripts/validate_skill_formats.py "$tree/scripts/"
          cp SECURITY.md "$tree/SECURITY.md"
          card="$tree/skills/engineering/poison-card"
          printf '# poison-card\n\nInstructions.\n' > "$card/SKILL.md"
          {
            printf '# EVIDENCE - poison-card\n\n| Field | Value |\n|---|---|\n'
            printf '| **Screen result** | UNMEASURED. |\n'
            printf '| **Paired verdict** | UNMEASURED. |\n'
          } > "$card/EVIDENCE.md"
          printf '#!/bin/sh\necho hi\n' > "$card/install.sh"
          if python scripts/validate_conformance.py --root "$tree" > "$log" 2>&1; then
            echo "::error::the planted .sh was ACCEPTED - the sweep does not reach the format gate"
            cat "$log"
            exit 1
          fi
          grep -q 'install.sh' "$log" \
            || { echo "::error::planted-format fixture failed for the wrong reason"; cat "$log"; exit 1; }
          echo "control: planted undeclared format rejected by the sweep as expected"
