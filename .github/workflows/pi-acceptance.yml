name: Pi acceptance regressions

on:
  pull_request:
    paths:
      - 'pi/scripts/**'
      - '.pi/engineering-env.json'
      - '.github/workflows/pi-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'pi/scripts/**'
      - '.pi/engineering-env.json'
      - '.github/workflows/pi-acceptance.yml'

permissions:
  contents: read

jobs:
  offline-acceptance:
    name: Pi offline acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install fixture test dependency
        run: python -m pip install pytest==9.1.1
      - name: Run offline regressions (no Pi or provider credentials)
        run: python pi/scripts/test_accept_pi.py -v
