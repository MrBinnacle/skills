<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376.4 72" width="376.4" height="72" role="img" aria-label="MRBINNACLE / skills">
  <!--
    Horizontal lockup: the receipt glyph + wordmark on one line. This is the
    default rendering (assets/tokens.json > wordmark.construction.default_rendering).
    Stack only below 360px -> lockup-stacked.svg.

    The mark is the receipt glyph the two banners draw, in the banners' own path
    data, scaled 28/90 so the glyph's 90-unit canvas stands 28px tall. The MB
    compact mark this file drew until 2026-09-06 left the repo identity by owner
    ruling (tokens.json > wordmark.compact_mark_retired); the receipt glyph is the
    repository's semantic mark and no replacement mark was manufactured.

    Geometry: clear space 22 (width of the M at 24px) on every side; mark 28px
    tall, 22.4px wide; 16px gap (a space token); wordmark set at 24px.
    Minimum size 120px wide (tokens.json > wordmark.minimum_size.full_lockup).

    Colour is currentColor by design: a file with no hex cannot violate the token
    set, and the same file inherits either ink (color.structural or
    color.structural_light, both declared since 2026-08-24). The banners draw the
    stamped line and seal in the muted neutral; here that relationship is carried
    by stroke-opacity on the same currentColor, so the file still declares no hex.
  -->
  <g transform="translate(22 22) scale(0.3111111)" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 4 h72 v78 l-9 8 -9 -8 -9 8 -9 -8 -9 8 -9 -8 -9 8 -9 -8 z"/>
    <line x1="14" y1="24" x2="58" y2="24"/>
    <line x1="14" y1="40" x2="58" y2="40"/>
    <line x1="14" y1="56" x2="40" y2="56" stroke-opacity="0.55"/>
    <circle cx="53" cy="56" r="6.5" stroke-width="2.5" stroke-opacity="0.55"/>
    <circle cx="53" cy="56" r="2" fill="currentColor" fill-opacity="0.55" stroke="none"/>
  </g>
  <text x="60.4" y="44.7" fill="currentColor" font-size="24" xml:space="preserve"><tspan
      font-family="Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif"
      font-weight="700" letter-spacing="-0.24">MRBINNACLE</tspan><tspan
      font-family="ui-monospace, &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace"
      font-weight="500"> / skills</tspan></text>
</svg>
