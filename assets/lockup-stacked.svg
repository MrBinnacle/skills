<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 338 105" width="338" height="105" role="img" aria-label="MRBINNACLE / skills">
  <!--
    Stacked lockup: compact mark above the wordmark. Use ONLY below 360px
    (assets/tokens.json > wordmark.construction.default_rendering); the
    horizontal lockup is the default everywhere else.

    Geometry: clear space 22 (width of the M at 24px) on every side; mark 28px,
    centred; 16px gap (a space token); wordmark set at 24px, centred.

    Colour is currentColor by design - see mark-mb.svg for why.
  -->
