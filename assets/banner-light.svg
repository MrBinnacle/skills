<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150" role="img" aria-label="skills. Skills that started with problems I encountered.">
  <style>
    .mono { font-family: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; }
  </style>
  <!-- receipt glyph. The stamped line and seal were #2da44e, the light-surface
       rendering of the sibling instrument's confirmed-success colour. They are
       now light.muted, declared in the kit by the same change that removed them
       here. See the note in banner-dark.svg for why no accent replaced it. -->
  <g transform="translate(24,25)">
    <path d="M0 4 h72 v78 l-9 8 -9 -8 -9 8 -9 -8 -9 8 -9 -8 -9 8 -9 -8 z"
          fill="none" stroke="#1e2020" stroke-width="3" stroke-linejoin="round"/>
    <line x1="14" y1="24" x2="58" y2="24" stroke="#1e2020" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="40" x2="58" y2="40" stroke="#1e2020" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="56" x2="40" y2="56" stroke="#5f614a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="53" cy="56" r="6.5" fill="none" stroke="#5f614a" stroke-width="2.5"/>
    <circle cx="53" cy="56" r="2" fill="#5f614a"/>
  </g>
  <!-- wordmark -->
  <text x="128" y="76" class="mono" font-size="44" font-weight="700" fill="#1e2020">skills</text>
  <!-- 48 characters at 18px mono ends near x=647 on the
       760-wide canvas; 19px would run to the edge. -->
  <text x="128" y="110" class="mono" font-size="18" fill="#5f614a">Skills that started with problems I encountered.</text>
</svg>
