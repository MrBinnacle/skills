<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="skills">
  <!--
    Favicon: the receipt glyph on a transparent ground, in the two banners' own
    path data, centred on a square canvas.

    An SVG favicon is loaded by the browser chrome, not by the page, so it cannot
    inherit currentColor. The two inks are therefore literal, and both are token
    values: light.ink #1F2328 by default, switching to repo.ink #E6EDF3 under
    prefers-color-scheme: dark (assets/tokens.json > color.structural_light,
    color.structural). The stamped line and seal carry the banners' muted-over-ink
    relationship through stroke-opacity on the same ink, so no third value ships.
    This file sits under assets/ so scripts/validate_brand_kit.py reads both hexes.

    2026-10-16 (#423): the inks are now the green palette, structural_light.ink
    #1E2020 and structural.ink #E3E6DD. The hexes named above are history.
  -->
  <style>
    .ink { stroke: #1e2020; }
    .seal { fill: #1e2020; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e3e6dd; }
      .seal { fill: #e3e6dd; }
    }
  </style>
  <g transform="translate(12 3)" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path class="ink" d="M0 4 h72 v78 l-9 8 -9 -8 -9 8 -9 -8 -9 8 -9 -8 -9 8 -9 -8 z"/>
    <line class="ink" x1="14" y1="24" x2="58" y2="24"/>
    <line class="ink" x1="14" y1="40" x2="58" y2="40"/>
    <line class="ink" x1="14" y1="56" x2="40" y2="56" stroke-opacity="0.55"/>
    <circle class="ink" cx="53" cy="56" r="6.5" stroke-width="2.5" stroke-opacity="0.55"/>
    <circle class="seal" cx="53" cy="56" r="2" fill-opacity="0.55" stroke="none"/>
  </g>
</svg>
