<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 338 62" width="338" height="62" role="img" aria-label="MRBINNACLE / skills">
  <!--
    Primary wordmark. Built to assets/tokens.json > wordmark:
      primary            "MRBINNACLE / skills"
      MRBINNACLE         Inter 700, uppercase, tight tracking
      / skills           system mono, 500, lowercase
      separator          slash
      default_rendering  one line; stack only below 360px -> see lockup-stacked.svg
      clear_space        width of the M on every side (22px at this size)
      minimum_size       full lockup 120px wide

    Set at 24px. The viewBox is sized for Inter 700 + a 0.6em mono advance; font
    substitution from the stack will change the fit slightly. Nominal, not exact.
    2026-10-16 (#423): the stacks are now IBM Plex Sans 700 and IBM Plex Mono 500.
    Behind <img> this file cannot load the site's @font-face, so Plex renders
    only where it is installed; the fit above was set for Inter and is nominal.

    Colour is currentColor by design: the kit declares dark-surface neutrals only
    (tokens.json > known_gaps.no_light_mode_neutrals), so a hard-coded hex here
    would be an invented token. Inherits from the embedding context instead.
  -->
  <text x="22" y="39" fill="currentColor" font-size="24" xml:space="preserve"><tspan
      font-family="&quot;IBM Plex Sans&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif"
      font-weight="700" letter-spacing="-0.24">MRBINNACLE</tspan><tspan
      font-family="&quot;IBM Plex Mono&quot;, ui-monospace, &quot;Cascadia Mono&quot;, Consolas, monospace"
      font-weight="500"> / skills</tspan></text>
</svg>
