<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="MRBINNACLE skills mark">
  <!--
    Compact mark. Built to assets/tokens.json > wordmark.compact_mark:
    MB inside a square instrument housing, 24x24 grid, square corners (2px max),
    1.5-2px stroke, one short calibration notch at twelve o'clock.
    Minimum rendered size 20px (tokens.json > wordmark.minimum_size.compact_mark).

    Geometry is centred on the housing interior rather than on the raw grid:
    with a 1.5 stroke the housing's inner edges sit at 2.75 and 21.25, so the
    letter band runs 4.875 to 19.125 (outer, centre 12.0) and 8 to 16 vertically
    (outer 7.25 to 16.75, centre 12.0). The M and B carry a 1.5 optical gap -
    at the 20px minimum a tighter gap closes up and the pair reads as one glyph.

    Colour is currentColor by design. The kit declares dark-surface neutrals only
    (tokens.json > known_gaps.no_light_mode_neutrals), so a hard-coded hex here
    would be an invented token. Inherits from the embedding context instead.
  -->
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- housing -->
    <rect x="2" y="2" width="20" height="20" rx="2"/>
    <!-- calibration notch, twelve o'clock -->
    <path d="M12 2 V5.5"/>
    <!-- M -->
    <path d="M5.625 16 V8 L8.125 11.9 L10.625 8 V16"/>
    <!-- B: spine, upper bowl, lower bowl -->
    <path d="M13.625 8 V16"/>
    <path d="M13.625 8 H16.125 A2 2 0 0 1 16.125 12 H13.625"/>
    <path d="M13.625 12 H16.375 A2 2 0 0 1 16.375 16 H13.625"/>
  </g>
</svg>
